<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu dinheiro">
<meta name="theme-color" content="#0f0f0e">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icone-v4.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Meu dinheiro</title>
<style>
html, body { margin: 0; height: 100%; min-height: 100vh; background: #0f0f0e; overflow: hidden; }
/* caixa presa abaixo do relógio e no fundo real da tela (inclui a área da barrinha do iPhone);
   o iframe ocupa 100% dela — iframe sozinho com top/bottom fica com 150px no Safari */
#caixa { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); bottom: 0; background: #0f0f0e; }
iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
/* aparece atrás do painel enquanto o Google carrega (pode levar uns 10 s) */
#carregando { position: absolute; inset: 0; z-index: 2; background: #0f0f0e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #a3a19b; font-size: 15px; text-align: center; padding: 24px; }
#carregando .bola { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #33322f; border-top-color: #56c288; animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
#carregando a { display: none; color: #fff; background: #2563eb; padding: 12px 18px; border-radius: 12px; text-decoration: none; font-weight: 650; }
#carregando.demorou a { display: inline-block; }
#carregando.pronto { display: none; }
#entrada { position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f2f1ee; }
#form { width: 100%; max-width: 340px; }
#form h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
#form p { margin: 0 0 18px; font-size: 14px; line-height: 1.45; color: #a3a19b; }
#form input { box-sizing: border-box; width: 100%; padding: 14px; font-size: 16px; color: #f2f1ee;
  background: #1b1b19; border: 1px solid #33322f; border-radius: 12px; outline: none; }
#form input:focus { border-color: #3b82f6; }
#form button { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; font-weight: 650; color: #fff;
  background: #2563eb; border: 0; border-radius: 12px; }
#form button:disabled { opacity: .6; }
</style>
</head>
<body>
<div id="caixa"><div id="carregando" class="pronto"><div class="bola"></div><div id="msg">Carregando…</div><a id="direto" href="#">Abrir o painel direto</a></div><iframe id="p" title="Meu dinheiro" allow="clipboard-write" style="display:none"></iframe></div>
<div id="entrada" style="display:none">
  <form id="form">
    <h1>Meu dinheiro</h1>
    <p id="aviso"></p>
    <input id="cod" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Código de acesso">
    <button id="ok" type="submit">Entrar</button>
  </form>
</div>
<script>
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycbyF-lVKNXhHHuqcXLgBgCLnY4AKqHavI4c2LsocxmEd9biIquBIfp2GEkclFB-O1p8/exec';
  var k = (location.hash.match(/k=([0-9a-zA-Z]+)/) || [])[1];
  try { if (k) localStorage.setItem('md_codigo', k); else k = localStorage.getItem('md_codigo'); } catch (e) {}
  var quadro = document.getElementById('p'), tela = document.getElementById('entrada');
  var campo = document.getElementById('cod'), aviso = document.getElementById('aviso'), botao = document.getElementById('ok');
  var carregando = document.getElementById('carregando'), msg = document.getElementById('msg');
  // Safari: altura do iframe em pixels, igual à da caixa (porcentagem às vezes vira 150px)
  var caixa = document.getElementById('caixa');
  function medir() { quadro.style.height = caixa.clientHeight + 'px'; }
  window.addEventListener('resize', medir); window.addEventListener('orientationchange', function () { setTimeout(medir, 300); });
  function abrir(c) {
    var url = BASE + '?k=' + encodeURIComponent(c);
    tela.style.display = 'none'; quadro.style.display = ''; medir();
    carregando.className = ''; msg.textContent = 'Carregando…';
    document.getElementById('direto').href = url;
    // se o Google não mostrar o painel aqui dentro, oferece abrir direto
    var espera = setTimeout(function () {
      carregando.className = 'demorou';
      msg.textContent = 'Está demorando. Se continuar assim, abra o painel direto:';
    }, 20000);
    // o painel avisa (postMessage 'md-pronto') quando terminou de desenhar
    window.addEventListener('message', function (ev) {
      if (ev.data === 'md-pronto') { clearTimeout(espera); carregando.className = 'pronto'; }
    });
    quadro.src = url;
  }
  function pedir(msg) {
    quadro.style.display = 'none'; tela.style.display = 'flex';
    aviso.textContent = msg || 'Informe o código de acesso. Ele fica salvo neste aparelho.';
    botao.disabled = false; botao.textContent = 'Entrar';
  }
  // Confere o código antes de guardar. Se não der para conferir, segue em frente.
  function conferir(c) {
    return fetch(BASE, { method: 'POST', body: JSON.stringify({ token: c, acao: 'dados' }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { return !(d && d.erro && /digo/i.test(String(d.erro))); })
      .catch(function () { return true; });
  }
  document.getElementById('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var c = campo.value.trim();
    if (!c) return;
    botao.disabled = true; botao.textContent = 'Conferindo…';
    conferir(c).then(function (certo) {
      if (!certo) { pedir('Código incorreto. Tente novamente.'); return; }
      try { localStorage.setItem('md_codigo', c); } catch (e) {}
      abrir(c);
    });
  });
  if (k) abrir(k); else pedir();
})();
</script>
</body>
</html>
